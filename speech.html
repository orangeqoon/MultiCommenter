<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCommenter - 音声認識入力 (Chrome Web Speech)</title>
    <style>
        :root {
            --orange-primary: #ff8c00;
            --orange-gradient: linear-gradient(135deg, #ff9900, #ff5500);
            --bg-dark: #16181d;
            --card-bg: #22262f;
            --text-main: #f0f2f5;
            --text-sub: #9ba1a6;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mascot-icon {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }

        h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--orange-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mic-wrapper {
            position: relative;
            margin: 12px 0;
        }

        .mic-btn {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            border: none;
            background: var(--orange-gradient);
            color: #fff;
            font-size: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(255, 100, 0, 0.4);
            transition: all 0.2s ease;
            z-index: 2;
            position: relative;
        }

        .mic-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .mic-btn.active {
            background: linear-gradient(135deg, #00c853, #64dd17);
            box-shadow: 0 8px 24px rgba(0, 200, 83, 0.5);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0.6); }
            70% { box-shadow: 0 0 0 18px rgba(0, 200, 83, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 200, 83, 0); }
        }

        .status-text {
            font-size: 13px;
            color: var(--text-sub);
            font-weight: 600;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 16px;
            border-radius: 10px;
        }

        .toggle-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
            cursor: pointer;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 38px;
            height: 22px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #444;
            transition: .3s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #ff8c00;
        }

        input:checked + .slider:before {
            transform: translateX(16px);
        }

        /* 認識プレビューエリア */
        .preview-box {
            width: 100%;
            min-height: 80px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            color: #fff;
            display: flex;
            flex-direction: column;
            gap: 4px;
            user-select: text;
        }

        .preview-interim {
            color: #ffaa44;
            font-style: italic;
        }

        .history-list {
            width: 100%;
            max-height: 140px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .history-item {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            user-select: text;
        }

        .history-item.sent {
            border-left: 3px solid #00c853;
            color: #e0e0e0;
        }

        .hint {
            font-size: 11px;
            color: #777;
            text-align: center;
            line-height: 1.4;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="/tray_icon.png" alt="オレンジ君" class="mascot-icon">
        <h2>オレンジ君 音声認識アシスタント</h2>
    </div>

    <div class="mic-wrapper">
        <button class="mic-btn" id="mic-btn" title="音声認識の開始/停止">🎙️</button>
    </div>
    <div class="status-text" id="status-text">マイクボタンを押して聞き取り開始</div>

    <div class="controls">
        <label class="toggle-label">
            <span>発話完了時に即座に自動送信する</span>
            <div class="toggle-switch">
                <input type="checkbox" id="auto-send-toggle">
                <span class="slider"></span>
            </div>
        </label>
        <label class="toggle-label">
            <span>継続リスニング (常駐モード)</span>
            <div class="toggle-switch">
                <input type="checkbox" id="keep-alive-toggle" checked>
                <span class="slider"></span>
            </div>
        </label>
    </div>

    <div class="preview-box">
        <span style="font-size: 11px; color: var(--text-sub);">リアルタイム認識:</span>
        <div id="interim-text" class="preview-interim">...</div>
    </div>

    <div style="width: 100%;">
        <div style="font-size: 11px; color: var(--text-sub); margin-bottom: 4px;">送信履歴:</div>
        <div class="history-list" id="history-list"></div>
    </div>

    <div class="hint">
        ※ Google Chromeのクラウド音声認識（Web Speech API）を使用しているため、PCのCPU負荷はほぼゼロ％です。配信やゲームの動作に影響を与えません。
    </div>
</div>

<script>
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status-text');
    const interimText = document.getElementById('interim-text');
    const autoSendToggle = document.getElementById('auto-send-toggle');
    const keepAliveToggle = document.getElementById('keep-alive-toggle');
    const historyList = document.getElementById('history-list');

    let recognition = null;
    let isListening = false;
    let keepAlive = true;

    // Web Speech API の初期化
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusText.textContent = "お使いのブラウザは音声認識に対応していません。Google Chrome をお使いください。";
        micBtn.disabled = true;
    } else {
        recognition = new SpeechRecognition();
        recognition.lang = 'ja-JP';
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            micBtn.classList.add('active');
            statusText.textContent = "音声を聞き取り中... (喋ると自動入力されます)";
        };

        recognition.onresult = (event) => {
            let interim = '';
            let finalTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                const transcript = event.results[i][0].transcript;
                if (event.results[i].isFinal) {
                    finalTranscript += transcript;
                } else {
                    interim += transcript;
                }
            }

            if (interim) {
                interimText.textContent = interim;
            }

            if (finalTranscript.trim()) {
                interimText.textContent = '...';
                handleFinalSpeech(finalTranscript.trim());
            }
        };

        recognition.onerror = (event) => {
            console.warn('[Speech] エラー:', event.error);
            if (event.error === 'no-speech') {
                // 音声なしは継続
                return;
            }
            statusText.textContent = `エラー: ${event.error}`;
        };

        recognition.onend = () => {
            if (isListening && keepAliveToggle.checked) {
                // 常駐モードなら自動再開
                try {
                    recognition.start();
                } catch (e) {}
            } else {
                isListening = false;
                micBtn.classList.remove('active');
                statusText.textContent = "聞き取り停止中 (クリックして再開)";
            }
        };
    }

    function toggleMic() {
        if (!recognition) return;
        if (isListening) {
            isListening = false;
            recognition.stop();
        } else {
            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }
    }

    micBtn.addEventListener('click', toggleMic);

    // 確定した音声を MultiCommenter サーバーへ転送
    async function handleFinalSpeech(text) {
        const autoSend = autoSendToggle.checked;
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        // 履歴表示
        const item = document.createElement('div');
        item.className = 'history-item sent';
        item.innerHTML = `<span>${escapeHtml(text)}</span><span style="font-size:10px; color:#888;">${autoSend ? '自動送信' : '入力転送'} ${time}</span>`;
        historyList.prepend(item);

        try {
            await fetch('/api/voice_input', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    text: text,
                    autoSend: autoSend
                })
            });
        } catch (err) {
            console.error('転送エラー:', err);
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    // 起動時に自動でリスニング開始
    window.addEventListener('load', () => {
        setTimeout(() => {
            if (!isListening && recognition) {
                toggleMic();
            }
        }, 500);
    });
</script>
</body>
</html>
