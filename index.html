<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiCommenter - Restream Shell</title>
    <style>
        :root {
            --bg-glass: rgba(18, 20, 24, 0.88);
            --border-glass: rgba(255, 255, 255, 0.1);
            --primary-accent: #2c97de;
            --text-main: #f0f2f5;
            --text-sub: #9ba1a6;
            --twitch-color: #9146ff;
            --youtube-color: #ff3333;
            --twitcast-color: #00a6ff;
            --nico-color: #ffffff;
            --kick-color: #53fc18;
            --fc2-color: #ff7700;
            --kukulu-color: #ffb300;
            --picarto-color: #1ba2f3;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 8px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: transparent;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Restream Chat グラスモーフィズム・コンテナ */
        .window-card {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg-glass);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-glass);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            overflow: hidden;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        /* クリック透過 (Ghost Mode) 時のスタイル */
        body.ghost-mode .window-card {
            border-color: rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.25);
            background: rgba(18, 20, 24, 0.65);
        }

        /* ドラッグ可能タイトルバー */
        .titlebar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.25);
            border-bottom: 1px solid var(--border-glass);
            -webkit-app-region: drag;
        }

        .title-left {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 700;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #fff;
        }

        .ghost-badge {
            display: none;
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            background: rgba(0, 229, 255, 0.2);
            color: #00e5ff;
            border: 1px solid rgba(0, 229, 255, 0.4);
            font-weight: 600;
        }
        body.ghost-mode .ghost-badge {
            display: inline-block;
        }

        .window-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            -webkit-app-region: no-drag;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--text-sub);
            width: 26px;
            height: 26px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 12px;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .control-btn.active {
            color: #00e5ff;
            background: rgba(0, 229, 255, 0.18);
            border: 1px solid rgba(0, 229, 255, 0.35);
        }

        .control-btn.close:hover {
            background: #e81123;
            color: #fff;
        }

        /* 配信先セレクター (Send message to:) */
        .channel-selector-bar {
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.15);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .selector-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .select-all-btn {
            background: none;
            border: none;
            color: var(--primary-accent);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            padding: 0;
        }
        .select-all-btn:hover {
            text-decoration: underline;
        }

        .platform-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
        }

        .platform-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 14px;
            font-size: 11.5px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #8e959d;
            transition: all 0.15s ease;
        }

        .platform-pill:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .platform-pill.active {
            background: rgba(255, 255, 255, 0.15);
            border-color: currentColor;
            box-shadow: 0 0 8px rgba(0,0,0,0.25);
        }

        .platform-pill.twitcasting.active { color: var(--twitcast-color); }
        .platform-pill.niconico.active { color: var(--nico-color); }
        .platform-pill.kukulu.active { color: var(--kukulu-color); }
        .platform-pill.fc2.active { color: var(--fc2-color); }
        .platform-pill.kick.active { color: var(--kick-color); }
        .platform-pill.twitch.active { color: var(--twitch-color); }
        .platform-pill.youtube.active { color: var(--youtube-color); }
        .platform-pill.picarto.active { color: var(--picarto-color); }

        .pill-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: currentColor;
        }

        /* タイムライン／チャットログ表示エリア */
        .chat-stream-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-stream-container::-webkit-scrollbar {
            width: 6px;
        }
        .chat-stream-container::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        /* メッセージカード */
        .chat-bubble {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            border-left: 3px solid var(--primary-accent);
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .bubble-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-sub);
        }

        .bubble-author {
            font-weight: 700;
            color: #fff;
        }

        .bubble-text {
            font-size: 13.5px;
            line-height: 1.4;
            color: #f5f5f7;
            word-break: break-word;
            user-select: text;
        }

        .bubble-results {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            margin-top: 2px;
        }

        .result-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .result-badge.success {
            background: rgba(46, 204, 113, 0.2);
            color: #2ecc71;
            border: 1px solid rgba(46, 204, 113, 0.3);
        }
        .result-badge.fail {
            background: rgba(231, 76, 60, 0.2);
            color: #e74c3c;
            border: 1px solid rgba(231, 76, 60, 0.3);
        }
        .result-badge.sending {
            background: rgba(241, 196, 15, 0.2);
            color: #f1c40f;
            border: 1px solid rgba(241, 196, 15, 0.3);
        }

        /* 最下部入力エリア (Restream Chat 風) */
        .chat-input-bar {
            padding: 10px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-top: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .chat-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 10px 16px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.2s ease;
            user-select: text;
        }

        .chat-input:focus {
            border-color: var(--primary-accent);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 0 2px rgba(44, 151, 222, 0.25);
        }

        .send-button {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: none;
            background: var(--primary-accent);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s ease;
            flex-shrink: 0;
        }

        .send-button:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .send-button:disabled {
            background: #333;
            color: #666;
            cursor: not-allowed;
            transform: none;
            filter: none;
        }

        .send-icon {
            width: 18px;
            height: 18px;
            fill: currentColor;
            transform: translateX(1px);
        }

        .shortcut-hint {
            font-size: 10px;
            color: var(--text-sub);
            text-align: center;
            padding-bottom: 4px;
        }
    </style>
</head>
<body>

<div class="window-card">
    <!-- Restream Chat 風タイトルバー (オレンジ君マスコット) -->
    <div class="titlebar" id="titlebar">
        <div class="title-left">
            <img src="/tray_icon.png" alt="オレンジ君" style="width: 22px; height: 22px; border-radius: 50%; box-shadow: 0 2px 6px rgba(255,140,0,0.5);">
            <span>MultiCommenter</span>
            <span class="ghost-badge" id="ghost-badge">👻 透過中 (解除可)</span>
        </div>
        <div class="window-controls" id="window-controls">
            <button class="control-btn active" id="pin-btn" title="最前面固定の切替 (Ctrl+Shift+T)">📌</button>
            <button class="control-btn" id="ghost-btn" title="クリック透過の切替 (Ctrl+Shift+Space)">👻</button>
            <button class="control-btn" id="min-btn" title="最小化">_</button>
            <button class="control-btn close" id="close-btn" title="閉じる">✕</button>
        </div>
    </div>

    <!-- 送信先セレクター (Send message to:) -->
    <div class="channel-selector-bar">
        <div class="selector-header">
            <span>Send message to:</span>
            <div>
                <button class="select-all-btn" onclick="toggleAll(true)">All</button>
                <span style="margin: 0 4px; color: #555;">|</span>
                <button class="select-all-btn" onclick="toggleAll(false)">None</button>
            </div>
        </div>
        <div class="platform-pills">
            <div class="platform-pill twitch active" data-platform="twitch" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> Twitch
            </div>
            <div class="platform-pill youtube active" data-platform="youtube" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> YouTube
            </div>
            <div class="platform-pill twitcasting active" data-platform="twitcasting" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> ツイキャス
            </div>
            <div class="platform-pill niconico active" data-platform="niconico" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> ニコニコ
            </div>
            <div class="platform-pill kick" data-platform="kick" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> Kick
            </div>
            <div class="platform-pill fc2 active" data-platform="fc2" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> FC2
            </div>
            <div class="platform-pill kukulu active" data-platform="kukulu" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> Kukulu
            </div>
            <div class="platform-pill picarto active" data-platform="picarto" onclick="togglePlatform(this)">
                <span class="pill-dot"></span> Picarto
            </div>
        </div>
    </div>

    <!-- チャットメッセージストリーム (楽観的UI) -->
    <div class="chat-stream-container" id="chat-stream">
        <div class="chat-bubble" style="border-left-color: #555;">
            <div class="bubble-header">
                <span class="bubble-author">System</span>
                <span>Ready</span>
            </div>
            <div class="bubble-text" style="color: var(--text-sub); font-size: 12px;">
                配信サイトを選択し、下の入力欄からメッセージを同時送信できます。
            </div>
        </div>
    </div>

    <!-- 入力バー -->
    <div class="chat-input-bar">
        <div class="input-wrapper">
            <input type="text" id="comment-input" class="chat-input" placeholder="Type a message to send... (Enter)" autocomplete="off">
        </div>
        <button class="send-button" id="send-btn" title="送信 (Enter)">
            <svg class="send-icon" viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
    <div class="shortcut-hint">
        Ctrl+Shift+T: 最前面固定 | Ctrl+Shift+Space: クリック透過 (👻)
    </div>
</div>

<script>
    // Electron API 連携 (preload経由または直接)
    const api = window.electronAPI || (window.require ? {
        minimize: () => window.require('electron').ipcRenderer.send('window-minimize'),
        close: () => window.require('electron').ipcRenderer.send('window-close'),
        togglePin: () => window.require('electron').ipcRenderer.send('toggle-pin'),
        toggleClickThrough: () => window.require('electron').ipcRenderer.send('toggle-click-through'),
        setIgnoreMouseEvents: (ignore, options) => window.require('electron').ipcRenderer.send('set-ignore-mouse-events', ignore, options),
        onPinStatusChanged: (cb) => window.require('electron').ipcRenderer.on('pin-status-changed', (_, val) => cb(val)),
        onClickThroughChanged: (cb) => window.require('electron').ipcRenderer.on('click-through-changed', (_, val) => cb(val))
    } : null);

    const pinBtn = document.getElementById('pin-btn');
    const ghostBtn = document.getElementById('ghost-btn');
    const minBtn = document.getElementById('min-btn');
    const closeBtn = document.getElementById('close-btn');
    const titlebar = document.getElementById('titlebar');
    let isGhostActive = false;

    if (api) {
        pinBtn.addEventListener('click', () => api.togglePin());
        ghostBtn.addEventListener('click', () => api.toggleClickThrough());
        minBtn.addEventListener('click', () => api.minimize());
        closeBtn.addEventListener('click', () => api.close());

        api.onPinStatusChanged((isPinned) => {
            pinBtn.classList.toggle('active', isPinned);
        });

        api.onClickThroughChanged((isClickThrough) => {
            isGhostActive = isClickThrough;
            ghostBtn.classList.toggle('active', isClickThrough);
            document.body.classList.toggle('ghost-mode', isClickThrough);
        });

        // クリック透過 (Ghost Mode) 中のスマートインタラクション:
        // タイトルバーにマウスが乗ったら操作可能にし、離れたら再び透過に戻す
        titlebar.addEventListener('mouseenter', () => {
            if (isGhostActive) {
                api.setIgnoreMouseEvents(false);
            }
        });

        titlebar.addEventListener('mouseleave', () => {
            if (isGhostActive) {
                api.setIgnoreMouseEvents(true, { forward: true });
            }
        });
    } else {
        // ブラウザ単体で開かれた場合はタイトルバー右側のElectron固有ボタンを非表示
        document.getElementById('window-controls').style.display = 'none';
    }

    // プラットフォーム選択
    function togglePlatform(el) {
        el.classList.toggle('active');
    }

    function toggleAll(enable) {
        document.querySelectorAll('.platform-pill').forEach(pill => {
            pill.classList.toggle('active', enable);
        });
    }

    function getSelectedPlatforms() {
        const selected = [];
        document.querySelectorAll('.platform-pill.active').forEach(pill => {
            selected.push(pill.getAttribute('data-platform'));
        });
        return selected;
    }

    // チャット送信 & 楽観的UI (Optimistic UI)
    const input = document.getElementById('comment-input');
    const sendBtn = document.getElementById('send-btn');
    const chatStream = document.getElementById('chat-stream');

    async function sendComment() {
        const text = input.value.trim();
        if (!text) return;

        const targets = getSelectedPlatforms();
        if (targets.length === 0) {
            alert('送信先のプラットフォームを1つ以上選択してください');
            return;
        }

        input.value = '';
        input.focus();

        // 1. 楽観的UIで即時吹き出しを追加 (Pending状態)
        const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const bubble = document.createElement('div');
        bubble.className = 'chat-bubble';
        
        let badgesHtml = targets.map(t => `<span class="result-badge sending" id="badge-${t}-${Date.now()}">${t}: 送信中...</span>`).join('');
        
        bubble.innerHTML = `
            <div class="bubble-header">
                <span class="bubble-author">You (Broadcaster)</span>
                <span>${time}</span>
            </div>
            <div class="bubble-text">${escapeHtml(text)}</div>
            <div class="bubble-results">${badgesHtml}</div>
        `;
        chatStream.appendChild(bubble);
        chatStream.scrollTop = chatStream.scrollHeight;

        // 2. サーバーへ POST
        try {
            const res = await fetch('/api/comment', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text, targets })
            });
            const data = await res.json();

            // 3. 結果に合わせて各プラットフォームのステータスバッジを更新
            if (data.success && data.results) {
                let updatedBadges = '';
                for (const t of targets) {
                    const result = data.results[t];
                    if (result && result.success) {
                        updatedBadges += `<span class="result-badge success">✓ ${t}</span>`;
                    } else {
                        const err = (result && result.error) ? result.error : '失敗';
                        updatedBadges += `<span class="result-badge fail" title="${escapeHtml(err)}">✕ ${t}: ${escapeHtml(err)}</span>`;
                    }
                }
                bubble.querySelector('.bubble-results').innerHTML = updatedBadges;
            } else {
                bubble.querySelector('.bubble-results').innerHTML = `<span class="result-badge fail">送信エラー: ${escapeHtml(data.error || '不明なエラー')}</span>`;
            }
        } catch (err) {
            bubble.querySelector('.bubble-results').innerHTML = `<span class="result-badge fail">通信エラー: ${escapeHtml(err.message)}</span>`;
        }
        chatStream.scrollTop = chatStream.scrollHeight;
    }

    sendBtn.addEventListener('click', sendComment);
    input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendComment();
        }
    });

    function escapeHtml(str) {
        return str.replace(/[&<>'"]/g, 
            tag => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                "'": '&#39;',
                '"': '&quot;'
            }[tag] || tag)
        );
    }

    input.focus();
</script>
</body>
</html>
